<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fantabuzzer Regia</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="wrap adminWrap"><header class="topbar"><div><h1>⚽ Fantabuzzer Live</h1><p class="muted">Regia asta</p></div><a class="linkbtn" href="/">Squadra</a></header>
<div class="auctionStage"><div class="stageMain">
<section class="card hero liveHero"><div class="eyebrow">GIOCATORE IN ASTA</div><div id="aPlayer" class="player">In attesa dell'inizio...</div><div id="aRole" class="roleBadge">-</div><div class="priceRow"><div><div class="eyebrow">OFFERTA ATTUALE</div><div id="aPrice" class="price">0</div><div class="muted">crediti</div></div><div><div class="eyebrow">TEMPO</div><div id="timerRing" class="timerRing"><span id="aTimer">--</span></div></div></div><div id="aLeader" class="leader">Nessuna offerta</div></section>
<div id="teamGrid" class="teamGrid"></div>
<section class="card compactCard"><div class="stageTools"><button id="pauseBtn">⏸ Pausa</button><button id="resumeBtn">▶ Riprendi</button></div><button id="resetBtn" class="danger full">Annulla asta corrente</button></section>
</div><aside class="stageSide">
<section class="card"><h2>Chiama giocatore</h2><input id="search" placeholder="Cerca calciatore, ruolo o club..."><div id="results" class="results"></div><div class="two"><input id="startPrice" type="number" value="1" min="0"><input id="duration" type="number" value="10" min="3" max="30"></div><button id="startBtn" class="primary">Avvia asta</button></section>
<section class="card"><details class="adminDetails"><summary>⚙ Gestione asta</summary><h2>Importa Excel</h2><input id="file" type="file" accept=".xlsx,.xls"><button id="importBtn" class="primary">Importa Excel</button><p id="importInfo" class="muted"></p><hr><h2>Squadre e budget</h2><div class="two"><input id="newTeam" placeholder="Nome squadra"><input id="newBudget" type="number" value="1000"></div><button id="createTeamBtn" class="primary">Aggiungi squadra</button><div id="teams"></div></details></section>
<section class="card"><details class="adminDetails"><summary>📋 Lista e storico</summary><input id="poolFilter" placeholder="Filtra elenco..."><p id="counts" class="muted"></p><div id="players"></div><h2 style="margin-top:18px">Storico acquisti</h2><div class="two"><button id="undoBtn">↩ Annulla ultimo</button><a class="linkbtn exportBtn" href="/api/export-auction-csv">⬇ CSV asta</a></div><div id="purchases"></div></details></section>
</aside></div></main><div id="toast" class="toast hidden"></div><script src="/socket.io/socket.io.js"></script><script src="/admin.js"></script></body></html>
