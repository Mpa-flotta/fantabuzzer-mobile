
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fantabuzzer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">
<header class="topbar">
<div><h1>⚽ Fantabuzzer</h1><p class="muted">Squadra</p></div>
<a class="linkbtn" href="/admin.html">Admin</a>
</header>

<section id="joinCard" class="card">
<h2>Entra con la tua squadra</h2>
<input id="team" placeholder="Nome squadra">
<button id="joinBtn" class="primary big">Entra</button>
</section>

<section id="teamCard" class="hidden">
<section class="card summary">
<div><small>SQUADRA</small><b id="myTeam">-</b></div>
<div><small>BUDGET</small><b id="myBudget">-</b></div>
<div><small>ROSA</small><b id="myCount">0/25</b></div>
</section>

<section class="card limits">
<div><span>P</span><b id="cntP">0/3</b></div>
<div><span>D</span><b id="cntD">0/8</b></div>
<div><span>C</span><b id="cntC">0/8</b></div>
<div><span>A</span><b id="cntA">0/6</b></div>
</section>

<section class="card hero">
<div class="eyebrow">GIOCATORE IN ASTA</div>
<div id="player" class="player">Nessun giocatore</div>
<div id="playerRole" class="roleBadge">-</div>
<div class="priceRow">
<div><div class="eyebrow">PREZZO</div><div id="price" class="price">0</div></div>
<div><div class="eyebrow">TEMPO</div><div id="timer" class="timer">--</div></div>
</div>
<div id="leader" class="leader">Nessuna offerta</div>
</section>

<section class="bidPanel">
<button class="bid" data-inc="1">+1</button>
<button class="bid" data-inc="2">+2</button>
<button class="bid" data-inc="5">+5</button>
</section>

<section class="card">
<h2>La mia rosa</h2>
<div id="roster"></div>
</section>
</section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/team.js"></script>
</body>
</html>
